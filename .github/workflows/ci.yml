name: ci

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0 or v0.2.0-rc1)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Configuration:
#   vars.GHCR_IMAGE   Destination image, e.g. `ghcr.io/myorg/myapp`.
#                     Falls back to the personal GHCR path below when unset.
#                     Set in repo Settings → Variables → Actions.
env:
  GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'ghcr.io/arindraaribudi/config-extractor-daemon' }}

jobs:
  publish:
    name: build + push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: resolve tag + sha
        id: resolve
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Multi-arch build + push with embedded SBOM + SLSA provenance attestations.
      # `attest: type=sbom` makes BuildKit attach an SPDX SBOM per platform as an
      # in-toto attestation (visible in GHCR's "Attestations" tab, consumable via
      # `cosign verify-attestation`). `provenance: mode=max` adds SLSA provenance.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          attest: type=sbom

      - name: summary
        if: always()
        run: |
          {
            echo "### Docker ${{ steps.resolve.outputs.tag }}"
            echo ""
            echo "- status: \`${{ job.status }}\`"
            echo "- image: \`${{ env.GHCR_IMAGE }}\`"
            echo "- tag: \`${{ steps.resolve.outputs.tag }}\`"
            echo "- sha: \`${{ steps.resolve.outputs.sha }}\`"
            echo "- trigger: \`${{ github.event_name }}\`"
          } >>"$GITHUB_STEP_SUMMARY"